<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deck topics preview</title></head><body class="app-shell"><div id="app"></div><script type="module">
import {createApp,h} from 'vue';
import CreateDeckSheet from '/src/components/Decks.vue';
import DeckSettings from '/src/components/DeckSettings.vue';
import {createI18nPlugin} from '/src/i18n/index.js';
import '/src/app.css';
const params=new URLSearchParams(location.search);
document.documentElement.dataset.theme=params.get('theme')||'light';
window.topicEvents=[];
window.preview=createApp({data:()=>({open:true}),render(){return h(params.has('settings')?DeckSettings:CreateDeckSheet,{ref:'sheet',open:this.open,deck:{id:'preview-deck',firebaseId:'preview-record',name:'Biology Revision',topic:{imageName:'other'},extraConfig:{}},onCreated:deck=>window.topicEvents.push({kind:'created',deck}),onSaved:deck=>window.topicEvents.push({kind:'saved',deck}),onDismiss:()=>{this.open=false;}});}}).use(createI18nPlugin()).mount('#app');
if(!params.has('settings'))window.preview.$refs.sheet.go('setName');
window.previewReady=true;
</script></body></html>
