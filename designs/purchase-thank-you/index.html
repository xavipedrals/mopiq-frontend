<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Mopiq · Thank-you page concepts</title><link rel="icon" href="assets/logo.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#17223a;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.review-bar{min-height:78px;padding:14px 26px;background:#fff;border-bottom:1px solid #dce1ea;display:flex;justify-content:space-between;align-items:center;gap:18px}.title{font-weight:650;font-size:14px;white-space:nowrap}.title small{display:block;font-size:10px;font-weight:400;color:#758095;margin-top:3px}.tabs,.tools{display:flex;gap:5px;align-items:center}.tabs button,.tools button,.tools a{font:inherit;font-size:11px;padding:9px 12px;border-radius:7px;border:0;text-decoration:none;background:transparent;color:#657085;cursor:pointer}.tabs button[aria-pressed=true]{background:#edf0ff;color:#5146b9}.tools button{background:#f1f4f8}.tools a{border:1px solid #e1e5ed}.canvas{display:flex;justify-content:center;padding:0;min-height:calc(100svh - 78px)}iframe{display:block;border:0;background:white;width:100%;height:calc(100svh - 78px)}.mobile iframe{width:390px;height:844px;border-radius:22px;box-shadow:0 15px 70px #18213a18}.mobile{padding:24px}.description{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#182238ed;color:#fff;border:1px solid #ffffff28;box-shadow:0 4px 20px #0002;font-size:10px;padding:9px 15px;border-radius:30px;pointer-events:none;text-align:center;max-width:95vw;white-space:nowrap}@media(max-width:900px){.review-bar{flex-wrap:wrap;gap:10px;padding:12px 16px}.title{font-size:12px}.tools{margin-left:auto}.tabs{order:3;width:100%;justify-content:center}.tabs button{flex:1}.tools a{display:none}.description{display:none}iframe{height:calc(100svh - 116px)}.canvas{min-height:calc(100svh - 116px)}.mobile{padding:12px}.mobile iframe{max-width:100%}}
</style></head><body><header class="review-bar"><div class="title">mopiq / after the purchase<small>Three design directions · Interactive HTML previews</small></div><nav class="tabs" aria-label="Design concepts"><button data-page="01-celebration.html" aria-pressed="true">01 / The celebration</button><button data-page="02-membership.html" aria-pressed="false">02 / The membership</button><button data-page="03-personal-note.html" aria-pressed="false">03 / The personal note</button></nav><div class="tools"><button id="device" aria-pressed="false">Mobile view</button><button id="theme" aria-pressed="false">Dark mode</button><a id="open" href="01-celebration.html" target="_blank" rel="noopener">Open page ↗</a></div></header><main class="canvas"><iframe src="01-celebration.html?theme=light" title="The celebration — thank-you page preview"></iframe></main><p class="description">A joyful welcome. One clear next step. A little moment worth celebrating.</p><script>
const frame=document.querySelector('iframe'),canvas=document.querySelector('.canvas'),openLink=document.querySelector('#open'),themeButton=document.querySelector('#theme'),deviceButton=document.querySelector('#device');let page='01-celebration.html',theme='light';const descriptions=['A joyful welcome. One clear next step. A little moment worth celebrating.','A confident, tangible membership. A new chapter in your learning.','A warm, personal thank-you. A little less transactional.'];function render(){frame.src=page+'?theme='+theme;openLink.href=frame.src}document.querySelectorAll('[data-page]').forEach((button,i)=>button.addEventListener('click',()=>{page=button.dataset.page;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('.description').textContent=descriptions[i];frame.title=button.textContent+' — thank-you page preview';render()}));themeButton.addEventListener('click',()=>{theme=theme==='light'?'dark':'light';themeButton.textContent=theme==='dark'?'Light mode':'Dark mode';themeButton.setAttribute('aria-pressed',String(theme==='dark'));render()});deviceButton.addEventListener('click',()=>{const mobile=canvas.classList.toggle('mobile');deviceButton.textContent=mobile?'Desktop view':'Mobile view';deviceButton.setAttribute('aria-pressed',String(mobile))});
</script></body></html>
